name: Publicar Pulso Finanzas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Probar recordatorios sin enviar correos
        run: node --test tests/reminders.test.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub puede tardar algunos segundos en hacer visible el artefacto.
      # Evita el error transitorio "No artifacts named github-pages".
      - name: Esperar disponibilidad del artefacto
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
